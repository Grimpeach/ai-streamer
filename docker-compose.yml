# Инфраструктура памяти ИИ-стримера.
# Адреса совпадают с дефолтами MemorySettings (src/core/config.py):
#   MEMORY__REDIS_URL=redis://127.0.0.1:6379/0
#   MEMORY__QDRANT_URL=http://127.0.0.1:6333
#
# Запуск:  docker compose up -d
# Статус:  docker compose ps
# Стоп:    docker compose down          (данные остаются в named volumes)
#          docker compose down -v       (ВНИМАНИЕ: удаляет лор и факты)

services:
  redis:
    image: redis:7-alpine
    container_name: ai-streamer-redis
    restart: unless-stopped
    # Порт публикуется только на localhost: у сервисов нет авторизации,
    # а стрим-машина обычно смотрит в интернет.
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      # Краткосрочный контекст диалога живёт с TTL (short_term_ttl_s),
      # поэтому вытесняем только истекающие ключи и не трогаем остальное.
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-streamer-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"  # REST API (используется qdrant-client)
      - "127.0.0.1:6334:6334"  # gRPC
    volumes:
      # Главное: векторная база лежит в named volume, а не внутри контейнера,
      # поэтому лор и факты переживают restart, update образа и пересоздание.
      - qdrant_storage:/qdrant/storage
      # Снапшоты коллекций — для бэкапа долгосрочной памяти.
      - qdrant_snapshots:/qdrant/snapshots
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
      # Единственная коллекция stream_memory, WAL можно не раздувать.
      QDRANT__STORAGE__WAL__WAL_CAPACITY_MB: 32
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
  qdrant_storage:
  qdrant_snapshots:
